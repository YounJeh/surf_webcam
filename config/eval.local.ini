# Configuration locale de démonstration.
# Toutes les valeurs sont fictives. Les "SERVER" pointent vers des stubs locaux :
# aucun appel réseau n'est effectué par ce package.

[Database]
PG_DATABASE=embedding_demo
VECTOR_SIZE=1024

[Network]
PEM_PATH=

[Embedding]
SERVER=http://embedding-stub.local
DEFAULT_MODEL=embed-demo-v1
BATCH_SIZE=16
CHUNK_SIZE=2000
CHUNK_OVERLAP=300
TOP_K=5
TIMEOUT=30
TOLOWER=True
PURGE_DELAY=30

[Embedding_source]
DEFAULT_MODEL=embed-demo-v1
CHUNK_SIZE=2000
CHUNK_OVERLAP=300
TOP_K=10

[Glossaire]
FUSIONNE_PATH=ressources/glossaire_fusionne.txt
CRISTAL_PATH=ressources/glossaire_metier.json

[Multiquery]
SERVER=http://llm-stub.local
DEFAULT_MODEL=llm-demo-instruct
TIMEOUT=30
TEMPERATURE=0.0
TOP_P=0.9
NB_VARIANTS=0

[Retriever]
NB_DB_RESULTS=20
RRF_MIN_RESULTS=30
RRF_MAX_RESULTS=50
USE_RERANKING=True
MMR_LAMBDA=0.8
NB_RESULTS=5
MAX_SEMANTIC_DISTANCE=0.9
NEIGHBOR_CHUNKS=0
USE_HYBRID_RETRIEVAL=True
LEXICAL_DB_RESULTS=20
LEXICAL_TRIGRAM_THRESHOLD=0.15
LEXICAL_FTS_WEIGHT=1.0
LEXICAL_TRIGRAM_WEIGHT=0.4

[Reranking]
SERVER=http://reranker-stub.local
DEFAULT_MODEL=rerank-demo-v1
BATCH_SIZE=16
TIMEOUT=30
SCORE_MINIMUM=0.0

[Response]
SERVER=http://llm-stub.local
DEFAULT_MODEL=llm-demo-instruct
TIMEOUT=60
TEMPERATURE=0.2
HISTORY_SIZE=0
